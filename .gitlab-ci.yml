image: ghcr.io/cirruslabs/android-sdk:35

stages:
  - verify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci"
  KINETIX_HTTP_BASE: "https://api.kinetix.invalid"
  KINETIX_WS_BASE: "wss://api.kinetix.invalid"

cache:
  key:
    files:
      - app/gradle.lockfile
      - gradle/libs.versions.toml
  paths:
    - .gradle-ci/caches/
    - .gradle-ci/wrapper/

verify_android:
  stage: verify
  script:
    - ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/test-results/testDebugUnitTest/
      - app/build/reports/lint-results-debug.html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
