name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  KINETIX_HTTP_BASE: ${{ vars.KINETIX_HTTP_BASE }}
  KINETIX_WS_BASE: ${{ vars.KINETIX_WS_BASE }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release configuration and signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KINETIX_HTTP_BASE" ] || [ -z "$KINETIX_WS_BASE" ]; then
            echo "KINETIX_HTTP_BASE and KINETIX_WS_BASE repository variables must be set for release builds."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets must be configured before publishing release artifacts."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinetix-release.jks"

      - name: Run full verification and build signed release artifacts
        env:
          KINETIX_RELEASE_STORE_FILE: ${{ runner.temp }}/kinetix-release.jks
          KINETIX_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINETIX_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINETIX_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        run: |
          APK_FILE="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          AAB_FILE="$(ls app/build/outputs/bundle/release/*.aab | head -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK_FILE"
          jarsigner -verify -strict "$AAB_FILE"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kinetix-release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
