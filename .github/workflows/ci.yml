name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KINETIX_HTTP_BASE: https://api.kinetix.invalid
      KINETIX_WS_BASE: wss://api.kinetix.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint, debug and release builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
