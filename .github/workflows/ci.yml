name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KINETIX_HTTP_BASE: https://api.kinetix.invalid
  KINETIX_WS_BASE: wss://api.kinetix.invalid

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and architecture gate
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug and R8 release builds
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  verify:
    needs: [test-and-lint, build]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require test-and-lint and build to succeed
        run: test "${{ needs.test-and-lint.result }}" = success && test "${{ needs.build.result }}" = success
